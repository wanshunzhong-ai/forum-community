{% if page_obj and page_obj.paginator.num_pages > 1 %}
<nav class="pagination">
  {% if page_obj.has_previous %}
    <a class="page-btn" href="?page={{ page_obj.previous_page_number }}{% if sort %}&sort={{ sort }}{% endif %}{% if q %}&q={{ q }}{% endif %}">← 上一页</a>
  {% else %}
    <span class="page-btn disabled">← 上一页</span>
  {% endif %}

  <span class="page-info">第 {{ page_obj.number }} / {{ page_obj.paginator.num_pages }} 页</span>

  {% if page_obj.has_next %}
    <a class="page-btn" href="?page={{ page_obj.next_page_number }}{% if sort %}&sort={{ sort }}{% endif %}{% if q %}&q={{ q }}{% endif %}">下一页 →</a>
  {% else %}
    <span class="page-btn disabled">下一页 →</span>
  {% endif %}
</nav>
{% endif %}
